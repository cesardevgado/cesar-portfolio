  <style>
  .text2x1 {
    border: 1px #000 solid;
    padding: 2em;
    margin: auto;
    overflow: hidden;
  }

  .col-6 {
    width: 45%;
  }

  .row {
    padding: 5%;
    --bs-gutter-x: 0;
  }

  #kittygrid-6 {
    fill: url(#myGradient2);
    stroke: black;
    stroke-width: 0;
    z-index: 2;
    position: absolute;
}

.kittyGrid {
    fill: none;
    stroke: black;
    stroke-width: 1;
    z-index: 2;
    position: absolute;
    width: 35vw;
  }

  #under-text {
    width: 75vw;
    font-size: 3vmax;
}

  #symbols2x11 {
    left: 44vw;

<body class="fade-in">

  <div class="row justify-content-md-center">
      <div class="col-6 text2x1">
          <svg class="kittyGrid" id="kittygrid-5" width="400" height="400" viewBox="0, 0, 400, 450"></svg>
          <svg width="300" height="300">
            <defs>
              <radialGradient id="myGradient1">
                <stop offset="15%" stop-color="black" />
                <stop offset="40%" stop-color="pink" />
                <stop offset="90%" stop-color="white" stop-opacity="0.25" />
              </radialGradient>
            </defs>
            <rect id="gradientSquare" width="35vw" height="35vw" style="fill:url(#myGradient2)" x="0%" y="15%"></rect>
          </svg>
          <p class="symbols2x1" id="symbols2x11"></p>

              </radialGradient>
            </defs>
          </svg>
          <p class="symbols2x1" id="symbols2x12"></p>
        </div>
        <div class="col-12">
          <div class="text-box" id="under-text">320 characters</div>
        </div>
      </div>

  <script>
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    // //Symbol selector
    document.querySelector("#symbols2x11").innerHTML =
      `&#` + String(getRandomInt(9985, 10087));
    document.querySelector("#symbols2x12").innerHTML =
      `&#` + String(getRandomInt(9985, 10087));
